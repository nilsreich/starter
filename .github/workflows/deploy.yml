name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Rollback: Commit-SHA oder 'previous'. Leer = normaler Deploy von main."
        required: false
        default: ""
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
  actions: write   # automatischer Rollback startet diesen Workflow erneut
  issues: write    # Issue „Deploy fehlgeschlagen“
jobs:
  check:
    if: inputs.version == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
  deploy:
    needs: check
    if: always() && !cancelled() && needs.check.result != 'failure' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ github.event.repository.name }}.${{ vars.APP_DOMAIN }}
    env:
      APP: ${{ github.event.repository.name }}
      INPUT_VERSION: ${{ inputs.version }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      HOST: ${{ vars.VPS_HOST }}
      USER_: ${{ vars.VPS_USER }}
      DOMAIN: ${{ vars.APP_DOMAIN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: SSH vorbereiten
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Version bestimmen
        id: v
        run: |
          set -euo pipefail
          T="$USER_@$HOST"; D="/srv/apps/$APP"
          if [ -z "$INPUT_VERSION" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "mode=build" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$INPUT_VERSION" = previous ]; then
            # letzter Eintrag mit anderer SHA als der aktuell laufenden (letzter Eintrag)
            sha=$(ssh -i ~/.ssh/id "$T" "cat $D/deploys.log 2>/dev/null || true" | awk 'NF{a[++n]=$2} END{for(i=n-1;i>=1;i--) if(a[i]!=a[n]){print a[i]; exit}}')
            [ -n "$sha" ] || { echo "::error::Kein vorheriger Deploy in $D/deploys.log gefunden."; exit 1; }
          else
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_VERSION" -q .sha)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "mode=rollback" >> "$GITHUB_OUTPUT"
          echo "::warning title=ROLLBACK auf ${sha:0:7}::Datenbank-Änderungen (Migrationen, Daten) werden NICHT zurückgedreht. Bei Bedarf Daten aus dem Pre-Deploy-Backup in $D/backups/ wiederherstellen (Datei predeploy-<datum>-<sha>.*, das zur Version gehört, vor der der Fehler auftrat)."
          echo "Vorhandene Pre-Deploy-Backups:"; ssh -i ~/.ssh/id "$T" "ls -1 $D/backups 2>/dev/null || echo '(keine)'"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.v.outputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bauen und pushen
        if: steps.v.outputs.mode == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.sha }}
      - name: Vorhandenes Image prüfen (Rollback)
        if: steps.v.outputs.mode == 'rollback'
        run: |
          docker manifest inspect "$IMAGE:${{ steps.v.outputs.sha }}" > /dev/null \
            || { echo "::error::Image $IMAGE:${{ steps.v.outputs.sha }} existiert nicht."; exit 1; }
      - name: Auf VPS ausrollen
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -euo pipefail
          T="$USER_@$HOST"; D="/srv/apps/$APP"
          ssh -i ~/.ssh/id "$T" "mkdir -p $D"
          scp -i ~/.ssh/id deploy/compose.yml "$T:$D/compose.yml"
          { printf '%s\n' "$PROD_ENV"; echo "IMAGE=$IMAGE:$SHA"; echo "APP_HOST=$APP.$DOMAIN"; } \
            | ssh -i ~/.ssh/id "$T" "umask 077 && cat > $D/.env"
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id "$T" "docker login ghcr.io -u $ACTOR --password-stdin >/dev/null"
          # Pre-Deploy-Backup, dann starten. Schlägt das Volume-Backup fehl, bricht der Deploy ab (SQLite-Snapshot: best effort).
          ssh -i ~/.ssh/id "$T" "bash -s -- $D $APP $SHA" <<'REMOTE'
          set -euo pipefail
          # Skript kommt über stdin: docker-Befehle dürfen es nicht lesen (</dev/null)
          D=$1; APP=$2; SHA=$3
          cd "$D"
          docker compose pull -q
          mkdir -p backups
          pre="backups/predeploy-$(date +%Y%m%d-%H%M%S)-${SHA:0:7}"
          # konsistenter SQLite-Snapshot (backup.db) vor dem Volume-Backup; erster Deploy: noch kein Container
          docker compose exec -T app bun src/server/index.ts backup </dev/null || true
          proj=$(basename "$PWD" | tr A-Z a-z | tr -cd 'a-z0-9_-')
          for vol in $(docker volume ls -q --filter "label=com.docker.compose.project=$proj"); do
            f="$pre.volume-${vol#"${proj}_"}.tar.gz"
            docker run --rm -v "$vol:/v:ro" alpine tar -czf - -C /v . </dev/null > "$f"
            gzip -t "$f"
          done
          docker compose up -d --remove-orphans
          echo "$(date -u +%FT%TZ) $SHA" >> deploys.log
          # nur die letzten 5 Pre-Deploy-Backups behalten
          ls -1 backups | sed -nE 's/^(predeploy-[0-9]{8}-[0-9]{6}-[0-9a-f]+)\..*/\1/p' | sort -u | head -n -5 \
            | while read -r p; do rm -f backups/"$p".*; done
          docker logout ghcr.io >/dev/null || true
          docker image prune -f >/dev/null || true
          REMOTE
          echo "Live: https://$APP.$DOMAIN"
      - name: Smoke-Test
        id: smoke
        env:
          # Startseite muss 200 liefern. Hinter Zugangsschutz in der Repo-Variable SMOKE_HOME_CODES z. B. "200 401" setzen.
          HOME_CODES: ${{ vars.SMOKE_HOME_CODES || '200' }}
        run: |
          set -uo pipefail
          base="https://$APP.$DOMAIN"
          code() { curl -s -o "${2:-/dev/null}" -m 10 -w '%{http_code}' "$1" || true; }
          for i in $(seq 1 24); do
            h=$(code "$base/health" /tmp/health)
            s=$(code "$base/")
            echo "Versuch $i: /health=$h /=$s"
            if [ "$h" = 200 ] && [ "$(cat /tmp/health)" = ok ] && [[ " $HOME_CODES " == *" $s "* ]]; then
              echo "Smoke-Test bestanden."; exit 0
            fi
            sleep 5
          done
          echo "::error::Smoke-Test gegen $base fehlgeschlagen (/health=$h, Startseite=$s)."
          exit 1
      - name: Zurückrollen und Issue anlegen
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          SHA: ${{ steps.v.outputs.sha }}
          MODE: ${{ steps.v.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          T="$USER_@$HOST"; D="/srv/apps/$APP"
          rolled="nein"
          if [ "$MODE" = build ]; then
            # Gibt es eine vorige, andere Version? Dann denselben Workflow mit version=previous starten.
            prev=$(ssh -i ~/.ssh/id "$T" "cat $D/deploys.log 2>/dev/null || true" | awk 'NF{a[++n]=$2} END{for(i=n-1;i>=1;i--) if(a[i]!=a[n]){print a[i]; exit}}')
            if [ -n "$prev" ] && gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" -f version=previous; then
              rolled="ja, automatisch auf ${prev:0:7} (neuer Lauf des Workflows „Deploy“)"
            else
              rolled="nein, es gab keine vorige Version oder der Start schlug fehl"
            fi
          fi
          title="Deploy fehlgeschlagen"
          if [ -n "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')" ]; then
            echo "Es gibt schon ein offenes Issue „$title“."; exit 0
          fi
          cat > /tmp/issue.md <<EOF
          ### Was soll passieren?
          Der Smoke-Test nach dem Deploy von \`${SHA:0:7}\` ist fehlgeschlagen (Health-Endpunkt oder Startseite von https://$APP.$DOMAIN antworteten nicht richtig). Ursache finden und beheben.

          - Zurückgerollt: $rolled
          - Lauf: $RUN_URL
          - Hinweis: Datenbankänderungen werden beim Zurückrollen nicht zurückgedreht.

          ### Woran erkenne ich, dass es fertig ist?
          Der Deploy-Lauf auf \`main\` besteht den Smoke-Test, und ein Test fängt die Ursache künftig ab.

          ### Was darf sich nicht ändern?
          –
          EOF
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/issue.md
