# Wird beim Deploy nach /srv/apps/<repo>/compose.yml kopiert.
# IMAGE und APP_HOST setzt der Deploy-Workflow. Keine Ports veröffentlichen – Caddy routet.
services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    networks: [web, internal]
    labels:
      caddy: ${APP_HOST}
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    stop_grace_period: 15s

networks:
  web:
    external: true
  internal: {}

volumes:
  data: {}
